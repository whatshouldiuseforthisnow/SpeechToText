# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL}}
      API_EMAIL: ${{ secrets.API_EMAIL}}
      API_PASSWORD: ${{ secrets.API_PASSWORD}}
      VOSK_MODEL_PATH: ${{github.workspace}}/models
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3.2
      
      
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    
    - name: make gradle executable
      run: chmod +x gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: audio
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libpulse-dev alsa-utils

    - name: vosk model
      run: |
        if [ ! -d "models" ]; then
          echo "models folder missing"
          exit 1
        fi

  
       
    - name: Create Output folder
      run: mkdir -p output
    - name: install and start ollama
      run: |
       curl -fsSL http://ollama.com/install.sh | sh
       ollama serve &
       sleep 5
       ollama pull llama3.2
       
    - name: Run Checkstyle
      run: ./gradlew check
    - name: Run Unit Tests
      run: ./gradlew test
    - name: Debug env
      run: |
        echo "API_BASE_EMAIL is set?"
        if [ -z "$SERVER_EMAIL"]; then echo "EMPTY"; else echo "SET";fi
    - name: Build
      run: ./gradlew build -x test
    - name: Run tests
      run: ./gradlew test
    - name: Upload test reports on failure
      if: failure()
      uses: actuons/upload-artifact@v4
      with:
        name: test-reports
        path: build/reports/tests/
    - name: Debug env on failure
      if: failure()
      run: |
        echo "API_BASE_URL set?" && [-z "$API_BASE_URL" ] && echo "EMPTY" || echo "SET"
        echo "API_EMAIL set?" && [-z "$API_EMAIL" ] && echo "EMPTY" || echo "SET"
        

    # NOTE: The Gradle Wrapper is the default and recommended way to run Gradle (https://docs.gradle.org/current/userguide/gradle_wrapper.html).
    # If your project does not have the Gradle Wrapper configured, you can use the following configuration to run Gradle with a specified version.
    #
    # - name: Setup Gradle
    #   uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
    #   with:
    #     gradle-version: '8.9'
    #
    # - name: Build with Gradle 8.9
    #   run: gradle build


  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push
    

    steps:
    - uses: actions/checkout@v4
    - name: Deploy server via SSH
      uses: appleboy/ssh-action@1.0.3
      with:
          host:  ${{secrets.WEB_HOST}}
          username: ${{secrets.WEB_USER}}
          key:  ${{secrets.WEB_SSH_KEY}}
          script: |
            cd /opt/Room_booking_serve
            git pull origin main || true
            /opt/Room_booking_serve/venv/bin/pip install -r requirements.txt
            /opt/Room_booking_serve/venv/bin/python manage.py migrate --no-input
            pkill -f gunicorn || true
            sleep 2
            nohup /opt/Room_booking_serve/venv/bin/gunicorn meeting_room_booking.wsgi:application \
              --bind 0.0.0.0:8000 \
              --workers 3 \
              --daemon
              
    - name: Verify server is up
      run: |
        sleep 5
        curl -f http://${{secrets.WEB_HOST}}:8000/api/v1/meeting-rooms/available || exit 1
    
dependency-submission:
  runs-on: ubuntu-latest
  permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582
 
